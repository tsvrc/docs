name: Documentation issue
description: A page is wrong, unclear or missing something.
labels: [documentation]
body:
  - type: textarea
    id: details
    attributes:
      label: What's wrong?
      description: What the page says or leaves out, and what would fix it.
    validations:
      required: true
  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: The tsvrc.com address of the page, if it exists.
